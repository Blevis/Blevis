<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="By the numbers: 836K chess games analysed, 10K bootstrap replicates, 21K-word German NLP corpus, 90% fare-quote coverage">
<title>By the numbers: 836K chess games analysed, 10K bootstrap replicates, 21K-word German NLP corpus, 90% fare-quote coverage</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#12000C"/><stop offset=".5" stop-color="#2C001E"/><stop offset="1" stop-color="#3D0F33"/>
</linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#E95420"/><stop offset=".55" stop-color="#F2A47F"/><stop offset="1" stop-color="#F5F1EA"/>
</linearGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#E95420"/><stop offset=".6" stop-color="#5E2750"/><stop offset="1" stop-color="#5E2750" stop-opacity="0"/>
</linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#E95420" stop-opacity=".35"/><stop offset="1" stop-color="#E95420" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowA" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#77216F" stop-opacity=".45"/><stop offset="1" stop-color="#77216F" stop-opacity="0"/>
</radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
  <circle cx="1.5" cy="1.5" r="1.1" fill="#AEA79F" fill-opacity=".13"/>
</pattern>
<filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<clipPath id="card"><rect width="1200" height="190" rx="18"/></clipPath>
<g clip-path="url(#card)">
<rect width="1200" height="190" fill="url(#bg)"/>
<rect width="1200" height="190" fill="url(#dots)"/>

<circle cx="600" cy="95" r="420" fill="url(#glowA)"/>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin="0.20s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur=".6s" begin="0.20s" fill="freeze"/>
<text x="40" y="92" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1" fill="url(#hot)">836K</text>
<text x="42" y="124" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#F5F1EA">rated chess games</text>
<text x="42" y="146" font-family="'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#AEA79F">analysed for first-move advantage</text>
</g>
<rect x="42" y="160" height="3" rx="1.5" width="0" fill="#E95420"><animate attributeName="width" from="0" to="210" dur="1.2s" begin="0.50s" fill="freeze"/></rect><rect x="300" y="36" width="1" height="118" fill="#5E2750"/><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin="0.45s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur=".6s" begin="0.45s" fill="freeze"/>
<text x="340" y="92" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1" fill="url(#hot)">10K</text>
<text x="342" y="124" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#F5F1EA">bootstrap replicates</text>
<text x="342" y="146" font-family="'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#AEA79F">behind every reported interval</text>
</g>
<rect x="342" y="160" height="3" rx="1.5" width="0" fill="#E95420"><animate attributeName="width" from="0" to="210" dur="1.2s" begin="0.75s" fill="freeze"/></rect><rect x="600" y="36" width="1" height="118" fill="#5E2750"/><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin="0.70s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur=".6s" begin="0.70s" fill="freeze"/>
<text x="640" y="92" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1" fill="url(#hot)">21K</text>
<text x="642" y="124" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#F5F1EA">word German corpus</text>
<text x="642" y="146" font-family="'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#AEA79F">parsed with spaCy NER + deps</text>
</g>
<rect x="642" y="160" height="3" rx="1.5" width="0" fill="#E95420"><animate attributeName="width" from="0" to="210" dur="1.2s" begin="1.00s" fill="freeze"/></rect><rect x="900" y="36" width="1" height="118" fill="#5E2750"/><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".6s" begin="0.95s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur=".6s" begin="0.95s" fill="freeze"/>
<text x="940" y="92" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1" fill="url(#hot)">90%</text>
<text x="942" y="124" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#F5F1EA">fare-quote coverage</text>
<text x="942" y="146" font-family="'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#AEA79F">target for NYC taxi pricing model</text>
</g>
<rect x="942" y="160" height="3" rx="1.5" width="0" fill="#E95420"><animate attributeName="width" from="0" to="210" dur="1.2s" begin="1.25s" fill="freeze"/></rect>
</g>
<rect x=".75" y=".75" width="1198.5" height="188.5" rx="18" fill="none" stroke="#5E2750" stroke-width="1.5"/>
</svg>
