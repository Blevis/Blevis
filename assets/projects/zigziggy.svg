<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" aria-label="ZigZiggy — Benchmarking harness and analysis of classic sorting and searching algorithms — measured, plotted and compared against theory.">
<title>ZigZiggy — Benchmarking harness and analysis of classic sorting and searching algorithms — measured, plotted and compared against theory.</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#12000C"/><stop offset=".5" stop-color="#2C001E"/><stop offset="1" stop-color="#3D0F33"/>
</linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#E95420"/><stop offset=".55" stop-color="#F2A47F"/><stop offset="1" stop-color="#F5F1EA"/>
</linearGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#E95420"/><stop offset=".6" stop-color="#5E2750"/><stop offset="1" stop-color="#5E2750" stop-opacity="0"/>
</linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#E95420" stop-opacity=".35"/><stop offset="1" stop-color="#E95420" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowA" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#77216F" stop-opacity=".45"/><stop offset="1" stop-color="#77216F" stop-opacity="0"/>
</radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
  <circle cx="1.5" cy="1.5" r="1.1" fill="#AEA79F" fill-opacity=".13"/>
</pattern>
<filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
<filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<clipPath id="card"><rect width="600" height="240" rx="18"/></clipPath>
<g clip-path="url(#card)">
<rect width="600" height="240" fill="url(#bg)"/>
<rect width="600" height="240" fill="url(#dots)"/>

<circle cx="560" cy="20" r="170" fill="url(#glow)" opacity=".7"/>
<text x="28" y="40" font-family="'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="2" fill="#E95420">◆ 05  ·  PERFORMANCE</text>
<text x="28" y="80" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-.5" fill="#F5F1EA">ZigZiggy</text>
<g transform="translate(548 30)">
  <circle r="18" fill="#12000C" stroke="#5E2750"/>
  <path d="M-5,5 L5,-5 M-3,-5 H5 V3" fill="none" stroke="#F2A47F" stroke-width="2" stroke-linecap="round"/>
</g>
<text x="28" y="112" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#F5F1EA" fill-opacity=".78">Benchmarking harness and analysis of classic</text><text x="28" y="134" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#F5F1EA" fill-opacity=".78">sorting and searching algorithms — measured,</text><text x="28" y="156" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#F5F1EA" fill-opacity=".78">plotted and compared against theory.</text>
<rect x="28.0" y="186" width="53.6" height="28" rx="14" fill="#5E2750" fill-opacity=".45" stroke="#5E2750"/><text x="54.8" y="204.5" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#F5F1EA">Java</text><rect x="89.6" y="186" width="98.0" height="28" rx="14" fill="#5E2750" fill-opacity=".45" stroke="#5E2750"/><text x="138.6" y="204.5" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#F5F1EA">Benchmarks</text><rect x="195.6" y="186" width="61.0" height="28" rx="14" fill="#5E2750" fill-opacity=".45" stroke="#5E2750"/><text x="226.1" y="204.5" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#F5F1EA">Big-O</text><rect x="264.6" y="186" width="83.2" height="28" rx="14" fill="#5E2750" fill-opacity=".45" stroke="#5E2750"/><text x="306.2" y="204.5" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#F5F1EA">Analysis</text>
</g>
<rect x=".75" y=".75" width="598.5" height="238.5" rx="18" fill="none" stroke="#5E2750" stroke-width="1.5"/>
<rect x=".75" y=".75" width="598.5" height="238.5" rx="18" fill="none" stroke="url(#hot)" stroke-width="2" pathLength="1000" stroke-dasharray="140 860" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="9s" begin="6.0s" repeatCount="indefinite"/></rect>
</svg>
