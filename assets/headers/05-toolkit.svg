<text x="129" y="68" font-family="'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" fill="#AEA79F" fill-opacity=".85">languages · ML &amp; data · tooling</text>
<rect x="640" y="41" width="520" height="2" fill="url(#ruleR)"/>
