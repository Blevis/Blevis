gin="2.54s" fill="freeze"/></text><text x="30" y="299" opacity="0" xml:space="preserve"><tspan fill="#E95420">now:      </tspan><tspan fill="#F5F1EA">statistical ML + NLP</tspan><animate attributeName="opacity" from="0" to="1" dur=".25s" begin="2.82s" fill="freeze"/></text><text x="30" y="345" opacity="0" xml:space="preserve"><tspan fill="#F2A47F">❯ </tspan><tspan fill="#F5F1EA">pytest -q</tspan><animate attributeName="opacity" from="0" to="1" dur=".25s" begin="3.38s" fill="freeze"/></text><text x="30" y="368" opacity="0" xml:space="preserve"><tspan fill="#9BD18B">✓ all checks passed</tspan><tspan fill="#AEA79F">  # ship it</tspan><animate attributeName="opacity" from="0" to="1" dur=".25s" begin="3.66s" fill="freeze"/></text><text x="30" y="391" xml:space="preserve"><tspan fill="#F2A47F">❯ </tspan></text><rect x="50" y="377" width="9" height="18" fill="#E95420" opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1s" begin="3.94s" repeatCount="indefinite"/></rect></g>
